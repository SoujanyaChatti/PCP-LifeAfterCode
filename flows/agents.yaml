# GitLab Duo Agent Platform — agent definitions.
#
# NOTE: The Duo Agent Platform schema is new and may differ from this; confirm
# against current Duo docs (PRD open question, Milestone 0). The trust model
# does NOT depend on Duo: the .gitlab-ci.yml implements the identical gated
# logic and is the guaranteed fallback. Each agent here gets a minimal,
# explicitly scoped token — no agent can both build and verify.

version: 1

agents:
  planner:
    prompt: agents/planner/prompt.md
    tools: [gitlab_issues_read, gitlab_issues_write, emit_claim]
    token_scope: [read_api, write_issue]

  builder:
    prompt: agents/builder/prompt.md
    tools: [git_feature_branch, gitlab_mr_write, emit_claim]
    token_scope: [read_api, write_repository_feature_branch, write_mr]

  pipeline_fixer:
    prompt: agents/pipeline_fixer/prompt.md
    tools: [gitlab_jobs_read, git_feature_branch, emit_claim]
    token_scope: [read_api, write_repository_feature_branch]
    max_attempts: 3

  redteam:
    prompt: agents/redteam/prompt.md
    tools: [exploit_runner_mcp, gitlab_issues_write, emit_claim]
    token_scope: [read_api, write_issue]
    env_required: [STAGING_URL]

  blueteam:
    prompt: agents/blueteam/prompt.md
    tools: [git_feature_branch, emit_claim]
    token_scope: [read_api, write_repository_feature_branch]
    max_attempts: 3

  release:
    prompt: agents/release/prompt.md
    tools: [gitlab_mr_merge, cloud_run_deploy, emit_claim]
    token_scope: [read_api, merge_protected_main, deploy_prod]

  reporter:
    prompt: agents/reporter/prompt.md
    tools: [gitlab_issues_write, read_evidence_pack]
    token_scope: [read_api, write_issue]

# MCP clients the agents may call. The verifier and exploit replay are exposed
# as MCP tools so an agent can REQUEST a check but never compute the verdict.
mcp_clients:
  verifier:
    command: ["python", "-m", "mcp_tools.verifier_server"]
    exposes: [run_check]
  exploit_replay:
    command: ["python", "-m", "mcp_tools.replay_server"]
    exposes: [replay_exploit]
