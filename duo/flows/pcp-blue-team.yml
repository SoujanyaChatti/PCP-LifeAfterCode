name: PCP Blue Team
description: 'Polygraph: when an MR pipeline fails, triages it and either patches the weaknesses the Red
  Team proved (with regression tests) or fixes the build honestly. Bounded to 3 rounds; every fix is re-proven
  by the pipeline''s exploit replay, never taken on the agent''s word.'
public: true
definition:
  version: v1
  environment: ambient
  components:
  - name: triage
    type: AgentComponent
    prompt_id: pcp_triage
    inputs:
    - from: context:goal
      as: goal
    - from: context:project_id
      as: project_id
    toolset:
